<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-Time Network Intrusion & Distributed Attack Detection System</title>
    <meta name="description" content="Big Data Analytics monitoring GUI for real-time intrusion detection, MapReduce IP baselining, Bloom filter verification, Flajolet-Martin distinct IP counting, Botnet community detection, and R regression forecasting." />
    <meta property="og:title" content="Real-Time Network Intrusion & Distributed Attack Detection System" />
    <meta property="og:description" content="Big Data Analytics monitoring GUI for real-time intrusion detection, MapReduce IP baselining, Bloom filter verification, Flajolet-Martin distinct IP counting, Botnet community detection, and R regression forecasting." />
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('bda_theme');
          const isDark = saved ? saved === 'dark' : true; // Default dark for cybersecurity monitoring
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
